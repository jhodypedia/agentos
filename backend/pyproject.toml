[project]
name = "agentos-backend"
version = "0.1.0"
description = "Self-hosted autonomous multi-agent AI platform - backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=43,<47",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.26.0",
    "pgvector>=0.3,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.17,<1",
    "pyyaml>=6.0.1,<7",
    "redis>=5.2,<8",
    "sqlalchemy>=2.0.36,<2.1",
    "structlog>=24.4,<26",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
agentos = "app.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live PostgreSQL and Redis instance",
    "redis: requires a live Redis instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RET", "RUF"]
ignore = [
    "S101",   # asserts are fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "RUF012"]
"app/core/config.py" = ["S105"]
"app/core/security.py" = ["S105", "S106"]
"app/schemas/user.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_covered = true
